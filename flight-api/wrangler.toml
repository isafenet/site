# AirReveal flight lookup (SkyLink API proxy). Deploy: npm run deploy (see README.md).
name = "airreveal-flights"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true
preview_urls = false

[vars]
# SkyLink's free trial is 1,000 requests a month. Every call is counted before it's made, so the cap is
# exact; the app shows what's left and turns Look Up Flight and status off when it's used up.
MONTHLY_CAP = "1000"
# Emergency-aircraft alerts: Apple's push service. Each environment has its own key; the .p8 files themselves
# are the APNS_KEY_SANDBOX and APNS_KEY_PRODUCTION secrets.
APNS_TEAM_ID = "5L66N8999D"
APNS_KEY_ID_SANDBOX = "8C7H265U62"
APNS_KEY_ID_PRODUCTION = "FPN8W449YW"
APNS_TOPIC = "com.isafenet.app.airreveal"
DAILY_LIMIT = "40"

[[d1_databases]]
binding = "DB"
database_name = "airreveal-flights"
database_id = "6b150cfc-06ea-43ef-acba-3d615e008892"
migrations_dir = "migrations"

# Daily: clear yesterday's rate-limit rows, expired cache entries and old alerts. Every minute: send
# emergency-aircraft alerts (does nothing while nobody has subscribed).
[triggers]
crons = ["23 3 * * *", "* * * * *"]
